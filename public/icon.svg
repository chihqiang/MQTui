<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <rect x="86" y="86" width="852" height="852" rx="190" fill="url(#bg)"/>

  <!-- 环形：中间件本身 -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#ring)" stroke-width="74"/>

  <!-- 两条消息从环上穿出，被环切开，35° 斜向 -->
  <g transform="rotate(-35 512 512)">
    <rect x="120" y="462" width="352" height="100" rx="50" fill="#22D3EE"/>
    <rect x="552" y="462" width="352" height="100" rx="50" fill="#FBBF24"/>
  </g>

  <!-- 中心：正在看的那个节点 -->
  <circle cx="512" cy="512" r="112" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="44" fill="#312E81"/>
</svg>
